# --- Edge Functions ---
# verify_jwt = true requires a valid Supabase JWT (Authorization: Bearer <token>)
# verify_jwt = false is used for endpoints that authenticate via other means (e.g. x-api-key)

[functions.apply-migration]
verify_jwt = true

[functions.apply-migrations-auto]
verify_jwt = true

[functions.apply-migrations]
verify_jwt = true

[functions.apply-rls-fix]
verify_jwt = true

[functions.create-user]
verify_jwt = true

[functions.evaristo-api]
verify_jwt = true

[functions.evaristo-autonomo]
verify_jwt = true

# extension-api uses x-api-key header from Chrome extension (not Supabase JWT)
[functions.extension-api]
verify_jwt = false

[functions.fetch-compras-agiles]
verify_jwt = true

[functions.limpiar-datos-prueba]
verify_jwt = true

[functions.matching-ai]
verify_jwt = true

# mercadopublico-api is a public proxy for MercadoPublico data
[functions.mercadopublico-api]
verify_jwt = false

# google-drive: acciones autenticadas (start/listar/descargar/desconectar)
[functions.google-drive]
verify_jwt = true

# google-drive-callback: Google redirige aquí sin JWT (verifica un state firmado)
[functions.google-drive-callback]
verify_jwt = false

# crear-pago-curso: la Academia es pública; el comprador puede no tener cuenta
[functions.crear-pago-curso]
verify_jwt = false

# academia-premium es público porque los compradores no requieren cuenta. El
# acceso usa un código secreto y la recuperación solo reenvía al correo de pago.
[functions.academia-premium]
verify_jwt = false

# mp-curso-webhook: Mercado Pago notifica sin JWT (se verifica el pago contra la API de MP)
[functions.mp-curso-webhook]
verify_jwt = false

# Worker privado para la bandeja durable de contracargos. Supabase valida el
# JWT y la función exige que el bearer sea exactamente el service_role.
[functions.procesar-academia-mp-inbox]
verify_jwt = true

[functions.resumir-bases]
verify_jwt = true

[functions.scoring-ai]
verify_jwt = true

[functions.send-notification]
verify_jwt = true

# sync-compras-agiles uses x-api-key header from Chrome extension (not Supabase JWT)
[functions.sync-compras-agiles]
verify_jwt = false

# sync-ordenes-compra uses x-api-key header from Chrome extension (not Supabase JWT)
[functions.sync-ordenes-compra]
verify_jwt = false

[functions.sync-health]
verify_jwt = false

# Scheduled syncs use the legacy service_role JWT in Authorization.
[functions.sync-licitaciones-bi]
verify_jwt = true

[functions.youtube-sync]
verify_jwt = true

[functions.contact-enrichment]
verify_jwt = true

[functions.enrichment-scheduler]
verify_jwt = false

[functions.marketing-ejecutar]
verify_jwt = true

# experto-consultar allows anonymous use; authenticated users are validated in the handler.
[functions.experto-consultar]
verify_jwt = false

# These functions validate the user JWT (or the exact service-role key) in the handler.
[functions.abogado-consultar]
verify_jwt = false

[functions.experto-pptx]
verify_jwt = false

# extract-proveedores-instituciones is called by cron job (public access)
[functions.extract-proveedores-instituciones]
verify_jwt = false

# cluster-customers is called by cron job (public access)
[functions.cluster-customers]
verify_jwt = false

[functions.sii-contribuyente]
verify_jwt = true
