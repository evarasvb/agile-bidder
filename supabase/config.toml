# --- Edge Functions ---
# verify_jwt = true requires a valid Supabase JWT (Authorization: Bearer <token>)
# verify_jwt = false is used for endpoints that authenticate via other means (e.g. x-api-key)

[functions.apply-migration]
verify_jwt = true

[functions.apply-migrations-auto]
verify_jwt = true

[functions.apply-migrations]
verify_jwt = true

[functions.apply-rls-fix]
verify_jwt = true

[functions.create-user]
verify_jwt = true

# extension-api uses x-api-key header from Chrome extension (not Supabase JWT)
[functions.extension-api]
verify_jwt = false

[functions.directorio]
verify_jwt = false

[functions.cobranza-leer-doc]
verify_jwt = true

[functions.fetch-compras-agiles]
verify_jwt = true

[functions.limpiar-datos-prueba]
verify_jwt = true

[functions.matching-ai]
verify_jwt = true

# mercadopublico-api is a public proxy for MercadoPublico data
[functions.mercadopublico-api]
verify_jwt = false

# google-drive: acciones autenticadas (start/listar/descargar/desconectar)
[functions.google-drive]
verify_jwt = true

# google-drive-callback: Google redirige aquí sin JWT (verifica un state firmado)
[functions.google-drive-callback]
verify_jwt = false

# crear-pago-curso: la Academia es pública; el comprador puede no tener cuenta
[functions.crear-pago-curso]
verify_jwt = false

# academia-premium es público porque los compradores no requieren cuenta. El
# acceso usa un código secreto y la recuperación solo reenvía al correo de pago.
[functions.academia-premium]
verify_jwt = false

# mp-curso-webhook: Mercado Pago notifica sin JWT (se verifica el pago contra la API de MP)
[functions.mp-curso-webhook]
verify_jwt = false

# Worker privado para la bandeja durable de contracargos. Supabase valida el
# JWT y la función exige que el bearer sea exactamente el service_role.
[functions.procesar-academia-mp-inbox]
verify_jwt = true

[functions.resumir-bases]
verify_jwt = true

[functions.scoring-ai]
verify_jwt = true

[functions.send-notification]
verify_jwt = true

# sync-compras-agiles uses x-api-key header from Chrome extension (not Supabase JWT)
[functions.sync-compras-agiles]
verify_jwt = false

# sync-ordenes-compra uses x-api-key header from Chrome extension (not Supabase JWT)
[functions.sync-ordenes-compra]
verify_jwt = false

[functions.sync-health]
verify_jwt = false

# Scheduled syncs use the legacy service_role JWT in Authorization.
[functions.sync-licitaciones-bi]
verify_jwt = true

[functions.youtube-sync]
verify_jwt = true

[functions.contact-enrichment]
verify_jwt = true

[functions.enrichment-scheduler]
verify_jwt = false

[functions.marketing-ejecutar]
verify_jwt = true

# experto-consultar allows anonymous use; authenticated users are validated in the handler.
[functions.experto-consultar]
verify_jwt = false

# These functions validate the user JWT (or the exact service-role key) in the handler.
[functions.abogado-consultar]
verify_jwt = false

[functions.experto-pptx]
verify_jwt = false

# extract-proveedores-instituciones is called by cron job (public access)
[functions.extract-proveedores-instituciones]
verify_jwt = false

# cluster-customers is called by cron job (public access)
[functions.cluster-customers]
verify_jwt = false

[functions.sii-contribuyente]
verify_jwt = true

# --- Funciones sin JWT de Supabase (autentican por otro medio o las llama un
# webhook/cron externo). DEBEN declararse aquí para que el auto-deploy no las
# vuelva a verify_jwt = true (el valor por defecto de la CLI) y las rompa. ---

# activar-miembro: enlace de activación abierto (valida un token propio)
[functions.activar-miembro]
verify_jwt = false

# mp-suscripcion-webhook: Mercado Pago notifica sin JWT
[functions.mp-suscripcion-webhook]
verify_jwt = false

# mp-pago-experto-webhook: Mercado Pago notifica sin JWT
[functions.mp-pago-experto-webhook]
verify_jwt = false

# publicar-libro-redes: la llama un cron/servicio, sin JWT de usuario
[functions.publicar-libro-redes]
verify_jwt = false

# marketing-generar-ia: acceso público controlado en el handler
[functions.marketing-generar-ia]
verify_jwt = false

# extension-adjuntos: la extensión Chrome autentica con x-api-key, no con JWT
[functions.extension-adjuntos]
verify_jwt = false

# webinar-baja: enlace público de baja (unsubscribe)
[functions.webinar-baja]
verify_jwt = false

# evaristo-vigia: la dispara un cron, sin JWT de usuario
[functions.evaristo-vigia]
verify_jwt = false

# sync-consultas-mercado: la dispara un cron/servicio, sin JWT de usuario
[functions.sync-consultas-mercado]
verify_jwt = false

# alertas-instituciones-seguidas: la dispara un cron con bearer service_role (JWT válido).
# NO valida el bearer en el handler y crea un cliente service_role, así que debe quedar en
# verify_jwt=true para no quedar expuesta a llamadas sin JWT. (El endurecimiento ideal es
# validar el bearer en el handler, como evaristo-vigia; queda como mejora aparte.)
[functions.alertas-instituciones-seguidas]
verify_jwt = true

# Correos de alerta disparados por cron con bearer service_role (JWT válido). No validan el
# bearer en el handler, así que quedan en verify_jwt=true para no aceptar llamadas sin JWT.
[functions.alerta-cita-email]
verify_jwt = true

[functions.alerta-drive-email]
verify_jwt = true

[functions.alerta-registro-email]
verify_jwt = true

[functions.alerta-onboarding-email]
verify_jwt = true

[functions.alerta-documento-email]
verify_jwt = true
