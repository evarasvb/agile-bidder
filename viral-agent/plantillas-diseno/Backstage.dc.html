<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5B301; }
    a:hover { color: #FF3B30; }
  </style>
</helmet>
<div style="width:1080px;height:1350px;position:relative;background:#0A1626;font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;">
  <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.05) 1.5px, transparent 1.5px);background-size:28px 28px;"></div>

  <div style="position:relative;display:flex;justify-content:space-between;align-items:center;padding:56px 64px 0 64px;">
    <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:999px;padding:10px 20px;">
      <span style="width:8px;height:8px;border-radius:50%;background:#F5B301;display:inline-block;"></span>
      <span style="color:#F6F5F1;font-size:20px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;">Detrás de cámara</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;background:rgba(255,59,48,0.15);border:1px solid rgba(255,59,48,0.4);border-radius:999px;padding:10px 18px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#FF3B30" stroke-width="2"/><path d="M10 8.5l6 3.5-6 3.5v-7z" fill="#FF3B30"/></svg>
      <span style="color:#FF3B30;font-size:18px;font-weight:700;letter-spacing:0.04em;">REEL</span>
    </div>
  </div>

  <div style="position:relative;padding:72px 64px 0 64px;">
    <div style="font-family:'Anton',sans-serif;font-weight:900;letter-spacing:-0.01em;font-size:70px;line-height:1.02;color:#F6F5F1;max-width:820px;">POR QUÉ ESCRIBÍ ESTE LIBRO</div>
  </div>

  <div style="position:relative;padding:36px 64px 0 64px;max-width:600px;">
    <p style="color:#B9C2D0;font-size:30px;line-height:1.5;font-weight:500;margin:0;">
      Años ayudando a PYMES a vender al Estado chileno, y vi el mismo patrón una y otra vez: el problema nunca es la oferta, es no entender las reglas del juego. Este libro es esa guía.
    </p>
  </div>

  <div style="position:absolute;left:64px;right:64px;bottom:180px;display:flex;gap:28px;">
    <div style="flex:1;height:380px;border-radius:24px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.35);border:2px solid rgba(255,255,255,0.15);">
      <img src="foto-enrique.jpg" alt="Enrique Varas" style="width:100%;height:100%;object-fit:cover;display:block;"/>
    </div>
    <div style="flex:1;height:380px;border-radius:24px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.35);border:2px solid rgba(245,179,1,0.35);background:#0A1626;display:flex;align-items:center;justify-content:center;">
      <img src="libro-portada.jpg" alt="Portada del libro" style="max-width:100%;max-height:100%;object-fit:contain;display:block;"/>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:40px 64px;border-top:1px solid rgba(255,255,255,0.12);">
    <div style="display:flex;align-items:center;gap:14px;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M2 16c2-2 4-2 6 0s4 2 6 0 4-2 6 0" stroke="#F5B301" stroke-width="2" stroke-linecap="round"/><path d="M2 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0" stroke="#FF3B30" stroke-width="2" stroke-linecap="round" opacity="0.7"/></svg>
      <span style="color:#F6F5F1;font-size:24px;font-weight:700;">@surfeandolicitaciones</span>
    </div>
    <span style="color:#6E7A8A;font-size:20px;font-weight:500;">Véndele al Estado y no mueras en el intento</span>
  </div>
</div>
</x-dc>
</body>
</html>
