<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #F5B301; }
    a:hover { color: #FF3B30; }
  </style>
</helmet>
<div style="width:1080px;height:1350px;position:relative;background:#0A1626;font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;">
  <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.05) 1.5px, transparent 1.5px);background-size:28px 28px;"></div>

  <div style="position:relative;display:flex;justify-content:space-between;align-items:center;padding:56px 64px 0 64px;">
    <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:999px;padding:10px 20px;">
      <span style="width:8px;height:8px;border-radius:50%;background:#F5B301;display:inline-block;"></span>
      <span style="color:#F6F5F1;font-size:20px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;">Tips prácticos</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;background:rgba(255,59,48,0.15);border:1px solid rgba(255,59,48,0.4);border-radius:999px;padding:10px 18px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 3h12v18l-6-4.5L6 21V3z" stroke="#FF3B30" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <span style="color:#FF3B30;font-size:18px;font-weight:700;letter-spacing:0.04em;">GUARDAR</span>
    </div>
  </div>

  <div style="position:relative;padding:72px 64px 0 64px;">
    <div style="font-family:'Anton',sans-serif;font-weight:900;letter-spacing:-0.01em;font-size:82px;line-height:0.98;color:#F6F5F1;">TU CHECKLIST</div>
    <div style="font-family:'Anton',sans-serif;font-weight:900;letter-spacing:-0.01em;font-size:52px;line-height:1.05;color:#F5B301;margin-top:8px;">ANTES DE POSTULAR</div>
  </div>

  <div style="position:relative;padding:56px 64px 0 64px;display:flex;flex-direction:column;gap:0;">
    <div style="display:flex;align-items:flex-start;gap:24px;padding:28px 0;border-top:1px solid rgba(255,255,255,0.14);">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;margin-top:4px;"><circle cx="12" cy="12" r="10" stroke="#F5B301" stroke-width="2"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#F5B301" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="color:#F6F5F1;font-size:32px;font-weight:700;line-height:1.3;">Revisa las bases hasta el final</span>
    </div>
    <div style="display:flex;align-items:flex-start;gap:24px;padding:28px 0;border-top:1px solid rgba(255,255,255,0.14);">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;margin-top:4px;"><circle cx="12" cy="12" r="10" stroke="#F5B301" stroke-width="2"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#F5B301" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="color:#F6F5F1;font-size:32px;font-weight:700;line-height:1.3;">Verifica tu inscripción y garantías</span>
    </div>
    <div style="display:flex;align-items:flex-start;gap:24px;padding:28px 0;border-top:1px solid rgba(255,255,255,0.14);border-bottom:1px solid rgba(255,255,255,0.14);">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;margin-top:4px;"><circle cx="12" cy="12" r="10" stroke="#F5B301" stroke-width="2"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#F5B301" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="color:#F6F5F1;font-size:32px;font-weight:700;line-height:1.3;">Calcula tu margen real, no el que "suena bien"</span>
    </div>
  </div>

  <div style="position:relative;padding:36px 64px 0 64px;max-width:600px;">
    <p style="color:#B9C2D0;font-size:26px;line-height:1.4;font-weight:500;margin:0;">
      Más detalle de todo el proceso en el libro — link en bio.
    </p>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:40px 64px;border-top:1px solid rgba(255,255,255,0.12);">
    <div style="display:flex;align-items:center;gap:14px;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M2 16c2-2 4-2 6 0s4 2 6 0 4-2 6 0" stroke="#F5B301" stroke-width="2" stroke-linecap="round"/><path d="M2 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0" stroke="#FF3B30" stroke-width="2" stroke-linecap="round" opacity="0.7"/></svg>
      <span style="color:#F6F5F1;font-size:24px;font-weight:700;">@surfeandolicitaciones</span>
    </div>
    <span style="color:#6E7A8A;font-size:20px;font-weight:500;">Véndele al Estado y no mueras en el intento</span>
  </div>
</div>
</x-dc>
</body>
</html>
