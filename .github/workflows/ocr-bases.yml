# Conversión y OCR de bases en el runner de GitHub (gratis, sin tope de 6 MB ni de 150 s):
# toma los adjuntos marcados ocr_pendiente y los deja en un PDF con texto que el lector
# (licitacion-adjuntos {bases}) sí puede leer, reemplaza/crea el archivo en Storage y lo reencola.
#   - PDF escaneado o ilegible  -> Tesseract (español) con ocrmypdf; si tampoco, Gemini vía experto-bases.
#   - PDF de más de 6 MB        -> Ghostscript lo comprime (150 dpi) conservando el texto.
#   - Word .doc/.docx           -> LibreOffice lo convierte a PDF.
#   - ZIP/RAR                   -> se extraen los PDF/Word de adentro (las bases suelen venir así) como adjuntos nuevos.
name: Convertir y OCR bases

on:
  schedule:
    # GitHub suele atrasar los cron: se pide cada 30 min y cada corrida sigue procesando lotes
    # hasta vaciar la cola o agotar su presupuesto de tiempo.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Archivos por lote'
        required: false
        default: '40'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  BUCKET: bases-licitacion
  LIMITE: ${{ github.event.inputs.limite || '40' }}
  # El lector (experto-bases) no acepta más de 6 MB.
  MAX_BYTES: '6000000'

jobs:
  convertir:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      # Se consulta antes de instalar nada: si no hay pendientes la corrida termina en segundos
      # y no gasta minutos de Actions.
      - name: Listar pendientes
        id: lista
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "::error::Faltan SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY"; exit 1; fi
          curl -sf -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/licitaciones_adjuntos?ocr_pendiente=eq.true&select=id,codigo,nombre,storage_path,content_type,bytes&order=bajado_en.asc&limit=$LIMITE" > pendientes.json \
            || { echo "::error::No pude listar pendientes"; exit 1; }
          n=$(jq length pendientes.json); echo "Pendientes: $n"; echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Instalar Tesseract, ocrmypdf y Ghostscript
        if: steps.lista.outputs.n != '0'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ocrmypdf tesseract-ocr-spa poppler-utils ghostscript jq unzip unrar-free

      - name: Procesar pendientes
        if: steps.lista.outputs.n != '0'
        run: |
          set -uo pipefail
          H=(-H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
          patch() { curl -s "${H[@]}" -X PATCH -H "Content-Type: application/json" -H "Prefer: return=minimal" "$SUPABASE_URL/rest/v1/licitaciones_adjuntos?id=eq.$1" -d "$2" > /dev/null; }
          # Sube un archivo local a Storage en la ruta dada (reemplaza si existe).
          subir() { curl -sf "${H[@]}" -X POST -H "Content-Type: $2" -H "x-upsert: true" --data-binary @"$1" "$SUPABASE_URL/storage/v1/object/$BUCKET/$(jq -rn --arg p "$3" '$p|@uri' | sed 's/%2F/\//g')" > /dev/null; }
          bajar() { curl -sf "${H[@]}" -o "$2" "$SUPABASE_URL/storage/v1/object/$BUCKET/$(jq -rn --arg p "$1" '$p|@uri' | sed 's/%2F/\//g')"; }
          chars() { pdftotext -layout "$1" - 2>/dev/null | tr -d '[:space:]' | wc -c; }
          # Deja un PDF bajo el tope: primero /ebook (150 dpi), si no alcanza /screen (72 dpi).
          comprimir() {
            local f="$1"
            for preset in ebook screen; do
              [ "$(stat -c%s "$f")" -le "$MAX_BYTES" ] && return 0
              if timeout 300 gs -q -sDEVICE=pdfwrite -dCompatibilityLevel=1.5 -dPDFSETTINGS=/$preset -dNOPAUSE -dBATCH -sOutputFile=small.pdf "$f" 2>/dev/null && [ -s small.pdf ]; then
                echo "   comprimido (/$preset): $(stat -c%s "$f") -> $(stat -c%s small.pdf) bytes"; mv small.pdf "$f"
              fi
            done
            [ "$(stat -c%s "$f")" -le "$MAX_BYTES" ]
          }
          # LibreOffice pesa (~1 min de instalación): se instala la primera vez que hace falta,
          # aunque el Word aparezca recién en un lote posterior.
          asegurar_soffice() { command -v soffice > /dev/null 2>&1 || { echo "   instalando LibreOffice…"; sudo apt-get install -y -q libreoffice-writer libreoffice-calc > /dev/null; }; }
          # OCR de un PDF. Modo "siempre": se rehace aunque traiga texto (--force-ocr) porque ese texto es
          # justo el que el lector no pudo usar (capa rara, firmado). Modo "si_falta": solo si no trae texto
          # (PDF encolados por tamaño: su texto está bien, solo pesan mucho).
          ocr() {
            local f="$1" cuando="$2" antes; antes=$(chars "$f")
            if [ "$antes" -ge 200 ] && [ "$cuando" = si_falta ]; then return 0; fi
            local modo=--skip-text; [ "$antes" -ge 200 ] && modo=--force-ocr
            echo "   texto previo: $antes caracteres · OCR $modo"
            if ! timeout 900 ocrmypdf -l spa $modo --invalidate-digital-signatures --rotate-pages --optimize 0 --output-type pdf --jobs 2 "$f" ocr.pdf > ocr.log 2>&1; then
              echo "   ocrmypdf terminó con error:"; tail -n 3 ocr.log
            fi
            [ -s ocr.pdf ] && mv ocr.pdf "$f"; rm -f ocr.pdf
          }
          # Reencola un PDF ya listo para el lector (reemplaza el archivo del adjunto).
          reencolar() { # id ruta archivo
            if subir "$3" application/pdf "$2"; then
              patch "$1" "{\"ocr_pendiente\":false,\"ocr_hecho\":true,\"bases_pendiente\":true,\"bases_intento_en\":null,\"bases_intentos\":0,\"storage_path\":\"$2\",\"content_type\":\"application/pdf\",\"bytes\":$(stat -c%s "$3")}"
              echo "   listo: en Storage y reencolado para lectura"; ok=$((ok+1))
            else
              echo "   no se pudo subir a Storage"; err=$((err+1))
            fi
          }
          # Último recurso para un PDF sin texto: Gemini lee la imagen.
          gemini() { # id codigo nombre archivo
            resp=$(curl -s "${H[@]}" -X POST -H "Content-Type: application/pdf" -H "X-OCR-IA: 1" -H "X-Codigo: $2" -H "X-Nombre: $(jq -rn --arg s "$3" '$s|@uri')" --data-binary @"$4" "$SUPABASE_URL/functions/v1/experto-bases")
            bid=$(echo "$resp" | jq -r '.id // empty' 2>/dev/null)
            if [ -n "$bid" ]; then
              patch "$1" "{\"ocr_pendiente\":false,\"ocr_hecho\":true,\"es_bases\":true,\"bases_id\":\"$bid\"}"
              echo "   Tesseract no sacó texto; Gemini sí (base $bid)"; ok=$((ok+1))
            else
              patch "$1" '{"ocr_pendiente":false,"ocr_hecho":true}'
              echo "   sin texto legible (Tesseract y Gemini): $(echo "$resp" | jq -r '.error // .' 2>/dev/null | head -c 120)"; sin=$((sin+1))
            fi
          }
          inicio=$(date +%s); ok=0; sin=0; err=0; lote=0; extraidos=0
          # Lotes sucesivos hasta vaciar la cola o llegar a 45 minutos (tope del job: 55).
          while :; do
          lote=$((lote+1))
          if [ "$lote" -gt 1 ]; then
            curl -sf "${H[@]}" "$SUPABASE_URL/rest/v1/licitaciones_adjuntos?ocr_pendiente=eq.true&select=id,codigo,nombre,storage_path,content_type,bytes&order=bajado_en.asc&limit=$LIMITE" > pendientes.json || break
          fi
          n=$(jq length pendientes.json); echo "--- lote $lote: $n archivos"
          [ "$n" -gt 0 ] || break
          for i in $(seq 0 $((n-1))); do
            if [ $(( $(date +%s) - inicio )) -gt 2700 ]; then echo "   presupuesto de tiempo agotado; el resto queda para la próxima corrida"; n=0; break; fi
            id=$(jq -r ".[$i].id" pendientes.json); codigo=$(jq -r ".[$i].codigo" pendientes.json)
            nombre=$(jq -r ".[$i].nombre" pendientes.json); ruta=$(jq -r ".[$i].storage_path" pendientes.json)
            ct=$(jq -r ".[$i].content_type // \"\"" pendientes.json)
            echo "== $codigo · $nombre ($ct)"
            # Algunos ZIP traen carpetas sin permiso de escritura: devolverlo antes de borrar.
            chmod -R u+rwX zipdir 2>/dev/null || true
            rm -rf in.* out.pdf small.pdf zipdir 2>/dev/null || true; mkdir -p zipdir
            case "$ct" in
              application/pdf) ext=pdf ;;
              application/msword) ext=doc ;;
              *wordprocessingml*) ext=docx ;;
              *zip*) ext=zip ;;
              *rar*) ext=rar ;;
              *) echo "   tipo no convertible"; patch "$id" '{"ocr_pendiente":false,"ocr_hecho":true}'; sin=$((sin+1)); continue ;;
            esac
            if ! bajar "$ruta" "in.$ext"; then
              echo "   no se pudo bajar de Storage"; patch "$id" '{"ocr_pendiente":false}'; err=$((err+1)); continue
            fi

            case "$ext" in
              pdf)
                cp in.pdf out.pdf
                # Encolado por tamaño (>6 MB): su texto sirve, solo hay que comprimir; OCR solo si no trae texto.
                # Encolado por lectura fallida (≤6 MB): se rehace el OCR siempre, como antes.
                if [ "$(stat -c%s in.pdf)" -gt "$MAX_BYTES" ]; then ocr out.pdf si_falta; else ocr out.pdf siempre; fi
                if ! comprimir out.pdf; then
                  echo "   sigue sobre el tope tras comprimir"; patch "$id" '{"ocr_pendiente":false,"ocr_hecho":true}'; sin=$((sin+1)); continue
                fi
                # A Gemini va la copia ya comprimida (la original puede superar su tope de 20 MB).
                if [ "$(chars out.pdf)" -ge 200 ]; then reencolar "$id" "$ruta" out.pdf; else gemini "$id" "$codigo" "$nombre" out.pdf; fi
                ;;
              doc|docx)
                asegurar_soffice
                if timeout 300 soffice --headless --convert-to pdf --outdir . "in.$ext" > /dev/null 2>&1 && [ -s in.pdf ]; then
                  mv in.pdf out.pdf
                  if comprimir out.pdf && [ "$(chars out.pdf)" -ge 200 ]; then
                    reencolar "$id" "${ruta%.*}.pdf" out.pdf
                  else
                    echo "   Word convertido pero sin texto útil o demasiado grande"; patch "$id" '{"ocr_pendiente":false,"ocr_hecho":true}'; sin=$((sin+1))
                  fi
                else
                  echo "   LibreOffice no pudo convertirlo"; patch "$id" '{"ocr_pendiente":false,"ocr_hecho":true}'; err=$((err+1))
                fi
                ;;
              zip|rar)
                if [ "$ext" = zip ]; then unzip -q -o "in.zip" -d zipdir 2>/dev/null || true; else unrar-free -x "in.rar" zipdir > /dev/null 2>&1 || true; fi
                # Solo los PDF/Word de adentro; cada uno pasa a ser un adjunto propio de la licitación.
                creados=0
                while IFS= read -r -d '' interno; do
                  base=$(basename "$interno"); iext="${base##*.}"; iext=$(echo "$iext" | tr 'A-Z' 'a-z')
                  cp "$interno" "int.$iext"; rm -f out.pdf
                  if [ "$iext" = pdf ]; then cp int.pdf out.pdf; ocr out.pdf si_falta
                  else asegurar_soffice; timeout 300 soffice --headless --convert-to pdf --outdir . "int.$iext" > /dev/null 2>&1; [ -s int.pdf ] && mv int.pdf out.pdf; fi
                  if [ ! -s out.pdf ] || ! comprimir out.pdf || [ "$(chars out.pdf)" -lt 200 ]; then echo "   · $base: sin texto útil, se omite"; continue; fi
                  nuevo_nombre="$nombre » $base"
                  limpio=$(echo "${base%.*}" | iconv -f utf8 -t ascii//TRANSLIT 2>/dev/null | sed 's/[^A-Za-z0-9._-]/_/g' | cut -c1-120)
                  nueva_ruta="$codigo/mp/$(basename "${ruta%.*}")__${limpio}.pdf"
                  if subir out.pdf application/pdf "$nueva_ruta"; then
                    fila=$(jq -cn --arg c "$codigo" --arg n "$nuevo_nombre" --arg r "$nueva_ruta" --arg d "Extraído de $nombre" --argjson b "$(stat -c%s out.pdf)" \
                      '{codigo:$c,nombre:$n,tipo:"Extraído de comprimido",descripcion:$d,bytes:$b,content_type:"application/pdf",storage_path:$r,es_bases:false,bases_pendiente:true,ocr_pendiente:false,ocr_hecho:true,bases_intentos:0,bajado_en:(now|todate)}')
                    curl -s "${H[@]}" -X POST -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates,return=minimal" "$SUPABASE_URL/rest/v1/licitaciones_adjuntos?on_conflict=codigo,nombre" -d "$fila" > /dev/null
                    echo "   · $base: extraído y reencolado"; creados=$((creados+1)); extraidos=$((extraidos+1))
                  fi
                done < <(find zipdir -type f \( -iname '*.pdf' -o -iname '*.doc' -o -iname '*.docx' \) -size +1k -print0 | head -z -n 15)
                patch "$id" '{"ocr_pendiente":false,"ocr_hecho":true}'
                if [ "$creados" -gt 0 ]; then ok=$((ok+1)); else echo "   comprimido sin PDF/Word legibles"; sin=$((sin+1)); fi
                ;;
            esac
          done
          [ "$n" -gt 0 ] || break
          done
          echo "======================================"
          echo "Listos: $ok · extraídos de comprimidos: $extraidos · sin texto: $sin · errores: $err · lotes: $lote"
