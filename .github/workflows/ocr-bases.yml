# OCR gratis para bases escaneadas: Tesseract (español) en el runner de GitHub, sin API ni cuota.
# Toma los PDF marcados ocr_pendiente (el lector los descartó por no traer texto), les agrega la capa
# de texto con ocrmypdf, reemplaza el archivo en Storage y lo reencola: el cron de lectura hace el resto.
# Si Tesseract tampoco saca texto (foto borrosa, manuscrito), último intento con Gemini vía experto-bases.
name: OCR bases escaneadas

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'PDF por corrida'
        required: false
        default: '15'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  BUCKET: bases-licitacion

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Instalar Tesseract y ocrmypdf
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ocrmypdf tesseract-ocr-spa poppler-utils jq

      - name: Procesar PDF pendientes
        env:
          LIMITE: ${{ github.event.inputs.limite || '15' }}
        run: |
          set -uo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "::error::Faltan SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY"; exit 1; fi
          H=(-H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
          patch() { curl -s "${H[@]}" -X PATCH -H "Content-Type: application/json" -H "Prefer: return=minimal" "$SUPABASE_URL/rest/v1/licitaciones_adjuntos?id=eq.$1" -d "$2" > /dev/null; }

          curl -sf "${H[@]}" "$SUPABASE_URL/rest/v1/licitaciones_adjuntos?ocr_pendiente=eq.true&content_type=eq.application/pdf&select=id,codigo,nombre,storage_path&order=bajado_en.asc&limit=$LIMITE" > pendientes.json \
            || { echo "::error::No pude listar pendientes"; exit 1; }
          n=$(jq length pendientes.json); echo "PDF pendientes de OCR: $n"
          ok=0; sin=0; err=0
          for i in $(seq 0 $((n-1))); do
            id=$(jq -r ".[$i].id" pendientes.json); codigo=$(jq -r ".[$i].codigo" pendientes.json)
            nombre=$(jq -r ".[$i].nombre" pendientes.json); ruta=$(jq -r ".[$i].storage_path" pendientes.json)
            ruta_uri=$(jq -rn --arg p "$ruta" '$p|@uri' | sed 's/%2F/\//g')
            echo "== $codigo · $nombre"
            rm -f in.pdf out.pdf
            if ! curl -sf "${H[@]}" -o in.pdf "$SUPABASE_URL/storage/v1/object/$BUCKET/$ruta_uri"; then
              echo "   no se pudo bajar de Storage"; patch "$id" '{"ocr_pendiente":false}'; err=$((err+1)); continue
            fi
            if ! timeout 600 ocrmypdf -l spa --skip-text --rotate-pages --optimize 0 --output-type pdf --jobs 2 in.pdf out.pdf > ocr.log 2>&1; then
              echo "   ocrmypdf terminó con error:"; tail -n 3 ocr.log
            fi
            [ -s out.pdf ] || cp in.pdf out.pdf
            chars=$(pdftotext -layout out.pdf - 2>/dev/null | tr -d '[:space:]' | wc -c)
            echo "   caracteres de texto tras OCR: $chars"
            if [ "$chars" -ge 200 ]; then
              if curl -sf "${H[@]}" -X POST -H "Content-Type: application/pdf" -H "x-upsert: true" --data-binary @out.pdf "$SUPABASE_URL/storage/v1/object/$BUCKET/$ruta_uri" > /dev/null; then
                patch "$id" "{\"ocr_pendiente\":false,\"bases_pendiente\":true,\"bases_intento_en\":null,\"bytes\":$(stat -c%s out.pdf)}"
                echo "   listo: reemplazado en Storage y reencolado para lectura"; ok=$((ok+1))
              else
                echo "   no se pudo subir a Storage"; err=$((err+1))
              fi
            else
              resp=$(curl -s "${H[@]}" -X POST -H "Content-Type: application/pdf" -H "X-OCR-IA: 1" -H "X-Codigo: $codigo" -H "X-Nombre: $(jq -rn --arg s "$nombre" '$s|@uri')" --data-binary @in.pdf "$SUPABASE_URL/functions/v1/experto-bases")
              bid=$(echo "$resp" | jq -r '.id // empty' 2>/dev/null)
              if [ -n "$bid" ]; then
                patch "$id" "{\"ocr_pendiente\":false,\"es_bases\":true,\"bases_id\":\"$bid\"}"
                echo "   Tesseract no sacó texto; Gemini sí (base $bid)"; ok=$((ok+1))
              else
                patch "$id" '{"ocr_pendiente":false}'
                echo "   sin texto legible (Tesseract y Gemini): $(echo "$resp" | jq -r '.error // .' 2>/dev/null | head -c 120)"; sin=$((sin+1))
              fi
            fi
          done
          echo "======================================"
          echo "OCR listo: $ok · sin texto: $sin · errores: $err"
