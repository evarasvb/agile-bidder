# Piloto: cargar Órdenes de Compra desde Datos Abiertos de ChileCompra.
# Fuente: https://transparenciachc.blob.core.windows.net/oc-da/AAAA-M.zip (CSV ; UTF-8).
# Se corre a mano (workflow_dispatch). MODO=probe mide sin insertar; MODO=load inserta.
name: Datos Abiertos OC (piloto)

on:
  workflow_dispatch:
    inputs:
      anio:
        description: 'Año (ej. 2026)'
        required: true
        default: '2026'
      mes:
        description: 'Mes sin cero (ej. 8)'
        required: true
        default: '8'
      modo:
        description: 'probe (medir) o load (insertar)'
        required: true
        default: 'probe'
        type: choice
        options: [probe, load]
      filtrar:
        description: 'Filtrar a rubros de firmavb (si/no)'
        required: true
        default: 'si'
        type: choice
        options: [si, no]

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Descargar y descomprimir
        env:
          ANIO: ${{ github.event.inputs.anio }}
          MES: ${{ github.event.inputs.mes }}
        run: |
          URL="https://transparenciachc.blob.core.windows.net/oc-da/${ANIO}-${MES}.zip"
          echo "Descargando $URL"
          curl -sSL --fail "$URL" -o oc.zip || { echo "::error::No se pudo descargar $URL"; exit 1; }
          ls -la oc.zip
          mkdir -p ocdata
          if unzip -o oc.zip -d ocdata >/dev/null 2>&1; then echo "unzip ok"; else
            echo "unzip falló, intento 7z"; sudo apt-get -y install p7zip-full >/dev/null 2>&1; 7z x -y -oocdata oc.zip >/dev/null;
          fi
          echo "=== contenido ==="; ls -laR ocdata | head -50
      - name: Procesar
        env:
          MODO: ${{ github.event.inputs.modo }}
          FILTRAR: ${{ github.event.inputs.filtrar }}
          OCDIR: ocdata
        run: node scripts/datos-abiertos-oc.mjs
