# Sincronización automática con API MercadoPúblico
# Trae licitaciones y órdenes de compra 3 veces al día
name: Sync MercadoPúblico API

on:
  schedule:
    # Ejecuta 3 veces al día (hora Chile: 6AM, 12PM, 6PM)
    # Chile = UTC-3 (CLT) / UTC-4 (CLST)
    - cron: '0 9 * * *'   # 6:00 AM Chile (CLT) / 5:00 AM (CLST)
    - cron: '0 15 * * *'  # 12:00 PM Chile (CLT) / 11:00 AM (CLST)
    - cron: '0 21 * * *'  # 6:00 PM Chile (CLT) / 5:00 PM (CLST)
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a consultar (ddmmaaaa). Ignorada si se usa rango.'
        required: false
        default: ''
      fecha_inicio:
        description: 'Fecha inicio rango (ddmmaaaa), ej: 01072026'
        required: false
        default: ''
      fecha_fin:
        description: 'Fecha fin rango (ddmmaaaa), ej: 26072026'
        required: false
        default: ''
      tipo:
        description: 'Tipo de consulta'
        required: true
        default: 'ambos'
        type: choice
        options:
          - licitaciones
          - ordenes
          - ambos

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  MP_API_TICKET: ${{ secrets.MP_API_TICKET }}

jobs:
  sync-mercadopublico:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Validar secrets
        run: |
          missing=""
          if [ -z "$SUPABASE_URL" ]; then missing="$missing SUPABASE_URL"; fi
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then missing="$missing SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -z "$MP_API_TICKET" ]; then missing="$missing MP_API_TICKET"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          echo "All required secrets are configured"

      - name: Configurar fechas
        id: fecha
        env:
          INPUT_FECHA: ${{ github.event.inputs.fecha }}
          INPUT_FECHA_INICIO: ${{ github.event.inputs.fecha_inicio }}
          INPUT_FECHA_FIN: ${{ github.event.inputs.fecha_fin }}
        run: |
          validate_date() {
            if ! echo "$1" | grep -qE '^[0-9]{8}$'; then
              echo "::error::Formato de fecha inválido: $1. Se esperaba ddmmaaaa (ej: 01072026)"
              exit 1
            fi
          }

          if [ -n "$INPUT_FECHA_INICIO" ] && [ -n "$INPUT_FECHA_FIN" ]; then
            validate_date "$INPUT_FECHA_INICIO"
            validate_date "$INPUT_FECHA_FIN"
            # Convertir ddmmaaaa → aaaa-mm-dd para date
            d_i="${INPUT_FECHA_INICIO:4:4}-${INPUT_FECHA_INICIO:2:2}-${INPUT_FECHA_INICIO:0:2}"
            d_f="${INPUT_FECHA_FIN:4:4}-${INPUT_FECHA_FIN:2:2}-${INPUT_FECHA_FIN:0:2}"
            if [ "$(date -d "$d_i" +%s)" -gt "$(date -d "$d_f" +%s)" ]; then
              echo "::error::fecha_inicio ($d_i) es posterior a fecha_fin ($d_f)"
              exit 1
            fi
            # Construir lista de fechas en formato ddmmaaaa
            lista=""
            current="$d_i"
            ts_f=$(date -d "$d_f" +%s)
            while [ "$(date -d "$current" +%s)" -le "$ts_f" ]; do
              dd=$(date -d "$current" +%d)
              mm=$(date -d "$current" +%m)
              aaaa=$(date -d "$current" +%Y)
              lista="$lista ${dd}${mm}${aaaa}"
              current=$(date -d "$current + 1 day" +%Y-%m-%d)
            done
            echo "FECHAS=$lista" >> "$GITHUB_OUTPUT"
            echo "FECHA=$INPUT_FECHA_INICIO" >> "$GITHUB_OUTPUT"
            echo "Rango de fechas: $INPUT_FECHA_INICIO → $INPUT_FECHA_FIN"
            echo "Fechas a procesar:$lista"
          elif [ -n "$INPUT_FECHA" ]; then
            validate_date "$INPUT_FECHA"
            echo "FECHAS=$INPUT_FECHA" >> "$GITHUB_OUTPUT"
            echo "FECHA=$INPUT_FECHA" >> "$GITHUB_OUTPUT"
            echo "Fecha a consultar: $INPUT_FECHA"
          else
            hoy=$(date -u +%d%m%Y)
            echo "FECHAS=$hoy" >> "$GITHUB_OUTPUT"
            echo "FECHA=$hoy" >> "$GITHUB_OUTPUT"
            echo "Fecha a consultar: $hoy (hoy)"
          fi

      - name: Sync Licitaciones
        id: sync-licitaciones
        if: ${{ github.event.inputs.tipo != 'ordenes' }}
        env:
          FECHAS: ${{ steps.fecha.outputs.FECHAS }}
        run: |
          echo "=== Sincronizando Licitaciones ==="
          total_synced=0
          total_errors=0
          global_status=success

          sync_fecha() {
            local FECHA="$1"
            echo "--- Licitaciones para fecha: $FECHA ---"
            MAX_RETRIES=3
            RETRY_DELAY=30
            attempt=0
            success=false

            while [ $attempt -lt $MAX_RETRIES ]; do
              attempt=$((attempt + 1))
              echo "Intento $attempt de $MAX_RETRIES..."

              http_code=$(curl -s -o /tmp/response_lic.json -w "%{http_code}" \
                --max-time 120 \
                --retry 2 \
                --retry-delay 10 \
                -X POST \
                "$SUPABASE_URL/functions/v1/mercadopublico-api" \
                -H "Authorization: ******" \
                -H "Content-Type: application/json" \
                -d "{\"action\": \"sync-licitaciones\", \"fecha\": \"$FECHA\", \"ticket\": \"$MP_API_TICKET\"}")

              echo "HTTP Status: $http_code"

              if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
                response=$(cat /tmp/response_lic.json)
                echo "Respuesta: $response"
                sync_success=$(echo "$response" | jq -r '.success // empty' 2>/dev/null)
                synced=$(echo "$response" | jq -r '.synced // 0' 2>/dev/null)
                errors=$(echo "$response" | jq -r '.errors | length // 0' 2>/dev/null)
                total_synced=$((total_synced + synced))
                total_errors=$((total_errors + errors))
                if [ "$sync_success" = "false" ] && [ "$errors" -gt 0 ]; then
                  echo "::warning::Sync $FECHA completado con $errors errores"
                fi
                success=true
                break
              else
                echo "::warning::Intento $attempt fallido HTTP $http_code"
                cat /tmp/response_lic.json 2>/dev/null || true
                if [ $attempt -lt $MAX_RETRIES ]; then
                  echo "Reintentando en ${RETRY_DELAY}s..."
                  sleep $RETRY_DELAY
                  RETRY_DELAY=$((RETRY_DELAY * 2))
                fi
              fi
            done

            if [ "$success" = false ]; then
              echo "::error::Sync Licitaciones para $FECHA falló después de $MAX_RETRIES intentos"
              global_status=failed
            fi
          }

          for FECHA in $FECHAS; do
            sync_fecha "$FECHA"
          done

          echo "licitaciones_synced=$total_synced" >> "$GITHUB_OUTPUT"
          echo "licitaciones_errors=$total_errors" >> "$GITHUB_OUTPUT"
          echo "licitaciones_status=$global_status" >> "$GITHUB_OUTPUT"

          if [ "$global_status" = "failed" ]; then
            exit 1
          fi

      - name: Sync Órdenes de Compra
        id: sync-ordenes
        if: ${{ github.event.inputs.tipo != 'licitaciones' }}
        env:
          FECHAS: ${{ steps.fecha.outputs.FECHAS }}
        run: |
          echo "=== Sincronizando Órdenes de Compra ==="
          total_synced=0
          total_errors=0
          global_status=success

          sync_fecha() {
            local FECHA="$1"
            echo "--- Órdenes de Compra para fecha: $FECHA ---"
            MAX_RETRIES=3
            RETRY_DELAY=30
            attempt=0
            success=false

            while [ $attempt -lt $MAX_RETRIES ]; do
              attempt=$((attempt + 1))
              echo "Intento $attempt de $MAX_RETRIES..."

              http_code=$(curl -s -o /tmp/response_oc.json -w "%{http_code}" \
                --max-time 120 \
                --retry 2 \
                --retry-delay 10 \
                -X POST \
                "$SUPABASE_URL/functions/v1/mercadopublico-api" \
                -H "Authorization: ******" \
                -H "Content-Type: application/json" \
                -d "{\"action\": \"sync-ordenes\", \"fecha\": \"$FECHA\", \"ticket\": \"$MP_API_TICKET\"}")

              echo "HTTP Status: $http_code"

              if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
                response=$(cat /tmp/response_oc.json)
                echo "Respuesta: $response"
                sync_success=$(echo "$response" | jq -r '.success // empty' 2>/dev/null)
                synced=$(echo "$response" | jq -r '.synced // 0' 2>/dev/null)
                errors=$(echo "$response" | jq -r '.errors | length // 0' 2>/dev/null)
                total_synced=$((total_synced + synced))
                total_errors=$((total_errors + errors))
                if [ "$sync_success" = "false" ] && [ "$errors" -gt 0 ]; then
                  echo "::warning::Sync $FECHA completado con $errors errores"
                fi
                success=true
                break
              else
                echo "::warning::Intento $attempt fallido HTTP $http_code"
                cat /tmp/response_oc.json 2>/dev/null || true
                if [ $attempt -lt $MAX_RETRIES ]; then
                  echo "Reintentando en ${RETRY_DELAY}s..."
                  sleep $RETRY_DELAY
                  RETRY_DELAY=$((RETRY_DELAY * 2))
                fi
              fi
            done

            if [ "$success" = false ]; then
              echo "::error::Sync Órdenes para $FECHA falló después de $MAX_RETRIES intentos"
              global_status=failed
            fi
          }

          for FECHA in $FECHAS; do
            sync_fecha "$FECHA"
          done

          echo "ordenes_synced=$total_synced" >> "$GITHUB_OUTPUT"
          echo "ordenes_errors=$total_errors" >> "$GITHUB_OUTPUT"
          echo "ordenes_status=$global_status" >> "$GITHUB_OUTPUT"

          if [ "$global_status" = "failed" ]; then
            exit 1
          fi

      - name: Actualizar timestamp de sync
        if: always()
        env:
          LIC_STATUS: ${{ steps.sync-licitaciones.outputs.licitaciones_status }}
          LIC_SYNCED: ${{ steps.sync-licitaciones.outputs.licitaciones_synced }}
          OC_STATUS: ${{ steps.sync-ordenes.outputs.ordenes_status }}
          OC_SYNCED: ${{ steps.sync-ordenes.outputs.ordenes_synced }}
          FECHA: ${{ steps.fecha.outputs.FECHA }}
        run: |
          echo "=== Registrando timestamp de sincronización ==="
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl -s -o /dev/null -w "HTTP %{http_code}" \
            --max-time 30 \
            -X POST \
            "$SUPABASE_URL/functions/v1/sync-health" \
            -H "Authorization: ******" \
            -H "Content-Type: application/json" \
            -d "{
              \"action\": \"update\",
              \"sync_type\": \"mercadopublico\",
              \"timestamp\": \"$timestamp\",
              \"fecha_consulta\": \"$FECHA\",
              \"licitaciones_status\": \"${LIC_STATUS:-skipped}\",
              \"licitaciones_synced\": ${LIC_SYNCED:-0},
              \"ordenes_status\": \"${OC_STATUS:-skipped}\",
              \"ordenes_synced\": ${OC_SYNCED:-0},
              \"run_id\": \"$GITHUB_RUN_ID\",
              \"run_url\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"
            }" || echo "::warning::Failed to update sync health status"

      - name: Resumen
        if: always()
        run: |
          echo "======================================"
          echo "SINCRONIZACIÓN COMPLETADA"
          echo "Fecha consultada: ${{ steps.fecha.outputs.FECHA }}"
          echo "Hora: $(date -u)"
          echo "--------------------------------------"
          echo "Licitaciones: ${{ steps.sync-licitaciones.outputs.licitaciones_status || 'skipped' }} (synced: ${{ steps.sync-licitaciones.outputs.licitaciones_synced || '0' }})"
          echo "Órdenes:      ${{ steps.sync-ordenes.outputs.ordenes_status || 'skipped' }} (synced: ${{ steps.sync-ordenes.outputs.ordenes_synced || '0' }})"
          echo "======================================"

  notify-failure:
    runs-on: ubuntu-latest
    needs: sync-mercadopublico
    if: failure()
    steps:
      - name: Notificar fallo de sincronización
        run: |
          echo "::error::MercadoPúblico sync failed! Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Post failure to sync-health endpoint for monitoring
          curl -s -o /dev/null \
            --max-time 30 \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/sync-health" \
            -H "Authorization: ****** secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"action\": \"alert\",
              \"sync_type\": \"mercadopublico\",
              \"status\": \"failed\",
              \"message\": \"MercadoPúblico sync workflow failed\",
              \"run_id\": \"$GITHUB_RUN_ID\",
              \"run_url\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"
            }" || true

      - name: Crear issue de fallo (si no existe uno abierto)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues?labels=sync-failure&state=open" \
            | jq 'length')

          if [ "$existing" = "0" ]; then
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
              -d "{
                \"title\": \"[Auto] Fallo en sync MercadoPúblico - $(date -u +%Y-%m-%d)\",
                \"body\": \"La sincronización automática con MercadoPúblico ha fallado.\\n\\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\\n\\nRevisa los logs del workflow para más detalles.\",
                \"labels\": [\"sync-failure\", \"bug\"]
              }"
            echo "Issue de fallo creado"
          else
            echo "Ya existe un issue abierto de sync-failure, no se crea otro"
          fi
