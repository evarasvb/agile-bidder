# Sync Licitaciones y Órdenes de Compra desde api.mercadopublico.cl
# Ejecuta script Node.js directo (NO depende de Edge Functions)
# Requiere: SUPABASE_URL, SUPABASE_SERVICE_KEY, MP_API_TICKET
name: Sync MercadoPublico API

on:
  schedule:
    # 3x al día (hora Chile: 6AM, 12PM, 6PM)
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha ddmmaaaa (vacío=hoy Chile)'
        required: false
        default: ''
      tipo:
        description: 'Tipo de sync'
        required: true
        default: 'ambos'
        type: choice
        options:
          - licitaciones
          - ordenes
          - ambos

jobs:
  sync-mercadopublico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Sync Licitaciones y Órdenes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MP_API_TICKET: ${{ secrets.MP_API_TICKET }}
          FECHA: ${{ github.event.inputs.fecha || '' }}
          SYNC_TYPE: ${{ github.event.inputs.tipo || 'ambos' }}
        run: npx tsx scripts/sync-licitaciones-ordenes-standalone.ts
