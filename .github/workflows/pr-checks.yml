# Gate de calidad en cada Pull Request: antes de este workflow, nada bloqueaba
# mergear a main aunque el build estuviera roto (el único CI existente,
# mantenimiento-diario.yml, usa `--if-present || echo 'completed'`, que reporta
# verde incluso si el paso real falla). Este workflow sí falla de verdad.

name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Edge deployment selection tests
        run: python3 -B -m unittest discover -s scripts -p 'test_select_edge_functions.py'

      - name: Install Chromium for mocked chat tests
        run: npx --no-install playwright install --with-deps chromium

      - name: Browser regression gate
        env:
          EVARISTO_BROWSER_TESTS: '1'
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          npm run test -- src/lib/evaristoContext.ui.test.ts --reporter=default --reporter=json --outputFile.json=/tmp/evaristo-browser-results.json
          node --input-type=module -e '
            import fs from "node:fs";
            const r = JSON.parse(fs.readFileSync("/tmp/evaristo-browser-results.json", "utf8"));
            if (!r.success || r.numPassedTests < 5 || r.numPendingTests !== 0 || r.numTodoTests !== 0) process.exit(1);
            console.log(`${r.numPassedTests} browser tests passed; none skipped`);
          '

      - name: Deno entrypoint type gate
        if: ${{ !cancelled() }}
        run: |
          npm exec --yes --package=deno@2.9.6 -- deno check --no-lock \
            supabase/functions/evaristo-soporte/index.ts \
            supabase/functions/experto-consultar/index.ts
