# Gate de calidad en cada Pull Request: antes de este workflow, nada bloqueaba
# mergear a main aunque el build estuviera roto (el único CI existente,
# evaristo-maintenance.yml, usa `--if-present || echo 'completed'`, que reporta
# verde incluso si el paso real falla). Este workflow sí falla de verdad.

name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npm run test
