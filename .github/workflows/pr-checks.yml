# Gate de calidad en cada Pull Request: antes de este workflow, nada bloqueaba
# mergear a main aunque el build estuviera roto (el único CI existente,
# mantenimiento-diario.yml, usa `--if-present || echo 'completed'`, que reporta
# verde incluso si el paso real falla). Este workflow sí falla de verdad.

name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npm run test
