# Auto-deploy de las Edge Functions de Supabase al hacer merge a main.
# Despliega SOLO las funciones cuya carpeta cambió en el push, más las que importan
# un módulo relativo modificado (también de forma transitiva), más aquellas cuyo
# verify_jwt cambió en supabase/config.toml.
# No hace un "deploy de todo": el radio de impacto es exactamente lo que se modificó.
# El verify_jwt de cada función lo controla supabase/config.toml (no tocarlo a mano).
#
# REQUISITO: agregar el secreto SUPABASE_ACCESS_TOKEN en
# Settings -> Secrets and variables -> Actions (token personal de Supabase,
# https://supabase.com/dashboard/account/tokens). Sin ese secreto el workflow
# falla de forma inofensiva (no despliega nada).
name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      funciones:
        description: 'Funciones a desplegar (separadas por espacio). Vacío = detectar por cambios.'
        required: false
        default: ''

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

env:
  PROJECT_REF: juiskeeutbaipwbeeezw

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # historial completo: diffs correctos incluso en push de varios commits

      - name: Probar selector local de funciones
        run: python3 -B -m unittest discover -s scripts -p 'test_select_edge_functions.py'

      - name: Verificar secreto SUPABASE_ACCESS_TOKEN
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN. Agrégalo en Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Instalar Supabase CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Se instala por descarga directa (no una action de terceros) para cumplir
          # la política del repo de solo actions permitidas y ancladas por SHA.
          URL="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/supabase/cli/releases/latest \
            | grep -oE '"browser_download_url": *"[^"]+_linux_amd64\.tar\.gz"' \
            | grep -oE 'https://[^"]+' | head -1)"
          if [ -z "$URL" ]; then
            echo "::error::No pude resolver el binario del Supabase CLI (linux_amd64)."
            exit 1
          fi
          echo "Descargando Supabase CLI: $URL"
          curl -fsSL "$URL" -o /tmp/supabase.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Detectar y desplegar funciones afectadas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MANUAL: ${{ github.event.inputs.funciones }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL:-}" ]; then
            python3 scripts/select-edge-functions.py --after "$EVENT_AFTER" --manual "$MANUAL" > /tmp/funcs.txt
          else
            AFTER="$EVENT_AFTER"
            BEFORE="$EVENT_BEFORE"
            # Conserva el fallback existente para push inicial/manual o before no disponible.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || echo "$AFTER")"
            fi
            echo "Diff $BEFORE..$AFTER"
            # Revisa ambos árboles: renombrados y borrados conservan los consumidores
            # anteriores. Un helper no agrega otras funciones que usan helpers ajenos.
            python3 scripts/select-edge-functions.py --before "$BEFORE" --after "$AFTER" > /tmp/funcs.txt
          fi

          FUNCS="$(sort -u /tmp/funcs.txt | grep -v '^$' || true)"
          if [ -z "$FUNCS" ]; then
            echo "No hay funciones que desplegar."
            exit 0
          fi
          echo "Funciones a desplegar:"; echo "$FUNCS"

          FAILED=""
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "Saltando '$fn' (no existe en el repo)."
              continue
            fi
            echo "== Desplegando $fn =="
            if ! supabase functions deploy "$fn" --project-ref "$PROJECT_REF"; then
              FAILED="$FAILED $fn"
            fi
          done <<< "$FUNCS"

          if [ -n "$FAILED" ]; then
            echo "::error::Fallaron estas funciones:$FAILED"
            exit 1
          fi
          echo "Listo. verify_jwt de cada función según supabase/config.toml."
