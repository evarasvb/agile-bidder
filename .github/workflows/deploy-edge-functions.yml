# Auto-deploy de las Edge Functions de Supabase al hacer merge a main.
# Despliega SOLO las funciones cuya carpeta cambió en el push, más las que importan
# un _shared modificado, más aquellas cuyo verify_jwt cambió en supabase/config.toml.
# No hace un "deploy de todo": el radio de impacto es exactamente lo que se modificó.
# El verify_jwt de cada función lo controla supabase/config.toml (no tocarlo a mano).
#
# REQUISITO: agregar el secreto SUPABASE_ACCESS_TOKEN en
# Settings -> Secrets and variables -> Actions (token personal de Supabase,
# https://supabase.com/dashboard/account/tokens). Sin ese secreto el workflow
# falla de forma inofensiva (no despliega nada).
name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      funciones:
        description: 'Funciones a desplegar (separadas por espacio). Vacío = detectar por cambios.'
        required: false
        default: ''

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

env:
  PROJECT_REF: juiskeeutbaipwbeeezw

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo: diffs correctos incluso en push de varios commits

      - name: Verificar secreto SUPABASE_ACCESS_TOKEN
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN. Agrégalo en Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Detectar y desplegar funciones afectadas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MANUAL: ${{ github.event.inputs.funciones }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL:-}" ]; then
            printf '%s\n' $MANUAL | sort -u > /tmp/funcs.txt
          else
            AFTER="$EVENT_AFTER"
            BEFORE="$EVENT_BEFORE"
            # En un push nuevo/forzado o si el before no está, usar el padre del commit.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || echo "$AFTER")"
            fi
            echo "Diff $BEFORE..$AFTER"

            CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" -- supabase/functions/ supabase/config.toml || true)"
            echo "Archivos cambiados:"; echo "$CHANGED"

            : > /tmp/funcs.txt

            # 1) Funciones cuya propia carpeta cambió (excluye _shared).
            echo "$CHANGED" | grep -E '^supabase/functions/[^_/][^/]*/' | sed -E 's#^supabase/functions/([^/]+)/.*#\1#' >> /tmp/funcs.txt || true

            # 2) Si cambió _shared, agregar las funciones que importan de ../_shared.
            if echo "$CHANGED" | grep -q '^supabase/functions/_shared/'; then
              echo "Cambió _shared: agrego las funciones que lo importan."
              grep -rlE '\.\./_shared/' supabase/functions --include='*.ts' 2>/dev/null \
                | sed -E 's#^supabase/functions/([^/]+)/.*#\1#' | grep -v '^_shared$' >> /tmp/funcs.txt || true
            fi

            # 3) Si cambió config.toml, agregar las funciones cuyo bloque [functions.X]
            #    tuvo un cambio de verify_jwt (líneas +/- de verify_jwt dentro del bloque).
            if echo "$CHANGED" | grep -q '^supabase/config.toml$'; then
              echo "Cambió config.toml: agrego las funciones cuyo verify_jwt cambió."
              git diff -U3 "$BEFORE" "$AFTER" -- supabase/config.toml | awk '
                { pfx = substr($0, 1, 1); rest = substr($0, 2) }
                rest ~ /^\[functions\./ { cur = rest; gsub(/[][]/, "", cur); sub(/^functions\./, "", cur) }
                (pfx == "+" || pfx == "-") && rest ~ /verify_jwt/ { if (cur != "") print cur }
              ' >> /tmp/funcs.txt || true
            fi
          fi

          FUNCS="$(sort -u /tmp/funcs.txt | grep -v '^$' || true)"
          if [ -z "$FUNCS" ]; then
            echo "No hay funciones que desplegar."
            exit 0
          fi
          echo "Funciones a desplegar:"; echo "$FUNCS"

          FAILED=""
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "Saltando '$fn' (no existe en el repo)."
              continue
            fi
            echo "== Desplegando $fn =="
            if ! supabase functions deploy "$fn" --project-ref "$PROJECT_REF"; then
              FAILED="$FAILED $fn"
            fi
          done <<< "$FUNCS"

          if [ -n "$FAILED" ]; then
            echo "::error::Fallaron estas funciones:$FAILED"
            exit 1
          fi
          echo "Listo. verify_jwt de cada función según supabase/config.toml."
