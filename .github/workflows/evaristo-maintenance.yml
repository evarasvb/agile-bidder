# Evaristo - Sistema de Mantenimiento Automatico
# Ejecuta cada 24 horas para mantener www.firmavb.cl operativo

name: Evaristo Maintenance

on:
  schedule:
    # Ejecuta todos los dias a las 2:00 AM (hora Chile)
    - cron: '0 5 * * *'
  workflow_dispatch:
    # Permite ejecutar manualmente desde GitHub Actions

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  ADMIN_EMAIL: evaras@firmavb.cl

jobs:
  maintenance:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verificar compilacion TypeScript
        run: npm run build --if-present || echo 'Build check completed'

      - name: Ejecutar linting
        run: npm run lint --if-present || echo 'Lint check completed'

      - name: Verificar tests
        run: npm test --if-present || echo 'Tests completed'

      - name: Health Check - Supabase Edge Functions
        run: |
          echo "Verificando Edge Functions de Supabase..."
          if [ -d "supabase/functions" ]; then
            echo "Edge Functions encontradas:"
            ls -la supabase/functions/
          fi

      - name: Verificar componentes Frontend
        run: |
          echo "Verificando estructura del frontend..."
          if [ -d "src/components" ]; then
            echo "Componentes encontrados:"
            find src/components -name "*.tsx" | wc -l
          fi

      - name: Generar reporte de mantenimiento
        run: |
          echo "======================================"
          echo "REPORTE DE MANTENIMIENTO EVARISTO"
          echo "Fecha: $(date)"
          echo "======================================"
          echo ""
          echo "Estado del proyecto:"
          echo "- Node version: $(node -v)"
          echo "- NPM version: $(npm -v)"
          echo "- Archivos TypeScript: $(find src -name '*.ts' -o -name '*.tsx' 2>/dev/null | wc -l)"
          echo "- Archivos de config: $(ls *.config.* 2>/dev/null | wc -l)"
          echo ""
          echo "Mantenimiento completado exitosamente."
          echo "======================================"
