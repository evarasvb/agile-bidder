# Carga el DETALLE por línea de producto (tabla oc_lineas) desde Datos Abiertos
# de ChileCompra. Es pesado (~1,4M líneas por mes), por eso conviene correr pocos
# meses por vez. MODO=probe vuelca columnas/muestra sin insertar; MODO=load inserta.
name: Datos Abiertos LÍNEAS (detalle por producto)

on:
  workflow_dispatch:
    inputs:
      anio:
        description: 'Año (ej. 2026)'
        required: true
        default: '2026'
      mes:
        description: 'Mes inicial sin cero (ej. 1)'
        required: true
        default: '1'
      mes_hasta:
        description: 'Mes final sin cero (para rango; vacío = solo el inicial)'
        required: false
        default: ''
      modo:
        description: 'probe (medir) o load (insertar)'
        required: true
        default: 'probe'
        type: choice
        options: [probe, load]

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Cargar líneas por mes
        env:
          ANIO: ${{ github.event.inputs.anio }}
          MES: ${{ github.event.inputs.mes }}
          MES_HASTA: ${{ github.event.inputs.mes_hasta }}
          MODO: ${{ github.event.inputs.modo }}
        run: |
          FIN="${MES_HASTA:-$MES}"
          echo "Procesando líneas ${MES}..${FIN} de ${ANIO} (modo=${MODO})"
          for M in $(seq "$MES" "$FIN"); do
            URL="https://transparenciachc.blob.core.windows.net/oc-da/${ANIO}-${M}.zip"
            echo "::group::Mes ${M} — ${URL}"
            rm -rf ocdata oc.zip; mkdir -p ocdata
            if ! curl -sSL --fail "$URL" -o oc.zip; then echo "::warning::No se pudo descargar $URL; sigo"; echo "::endgroup::"; continue; fi
            ls -la oc.zip
            if ! unzip -o oc.zip -d ocdata >/dev/null 2>&1; then
              sudo apt-get -y install p7zip-full >/dev/null 2>&1; 7z x -y -oocdata oc.zip >/dev/null;
            fi
            OCDIR=ocdata node scripts/datos-abiertos-lineas.mjs
            echo "::endgroup::"
          done
          echo "Rango completo."
