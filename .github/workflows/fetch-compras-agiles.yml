# Sincronización automática de Compras Ágiles desde buscador.mercadopublico.cl
# Ejecuta la Edge Function fetch-compras-agiles cada 4 horas
# La función obtiene un JWT público automáticamente y hace upsert en Supabase
name: Fetch Compras Ágiles

on:
  schedule:
    # Cada 4 horas (hora UTC) → Chile: 0:00, 4:00, 8:00, 12:00, 16:00, 20:00
    - cron: '0 3 * * *'    # 00:00 Chile
    - cron: '0 7 * * *'    # 04:00 Chile
    - cron: '0 11 * * *'   # 08:00 Chile
    - cron: '0 15 * * *'   # 12:00 Chile
    - cron: '0 19 * * *'   # 16:00 Chile
    - cron: '0 23 * * *'   # 20:00 Chile
  workflow_dispatch:
    inputs:
      hours_back:
        description: 'Horas hacia atrás a consultar (default: 10)'
        required: false
        default: '10'
      max_pages:
        description: 'Máximo de páginas a procesar (default: 50)'
        required: false
        default: '50'
      fetch_details:
        description: 'Obtener ficha detallada de cada compra'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      status:
        description: 'Filtro de estado (vacío=todos, 2=publicada)'
        required: false
        default: ''

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  fetch-compras-agiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fetch Compras Ágiles via Edge Function
        id: fetch
        run: |
          echo "=== Fetch Compras Ágiles ==="
          echo "Fecha: $(TZ='America/Santiago' date '+%Y-%m-%d %H:%M:%S %Z')"

          # Parámetros
          HOURS_BACK="${{ github.event.inputs.hours_back || '10' }}"
          MAX_PAGES="${{ github.event.inputs.max_pages || '50' }}"
          FETCH_DETAILS="${{ github.event.inputs.fetch_details || 'true' }}"
          STATUS="${{ github.event.inputs.status || '' }}"

          echo "Parámetros: hours_back=$HOURS_BACK, max_pages=$MAX_PAGES, fetch_details=$FETCH_DETAILS, status=$STATUS"

          # Llamar a la Edge Function
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ env.SUPABASE_URL }}/functions/v1/fetch-compras-agiles" \
            -H "Authorization: Bearer ${{ env.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"hours_back\": $HOURS_BACK,
              \"max_pages\": $MAX_PAGES,
              \"fetch_details\": $FETCH_DETAILS,
              \"status\": \"$STATUS\"
            }" \
            --max-time 600)

          # Separar body y status code
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Respuesta: $BODY"

          # Verificar resultado
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "status=success" >> $GITHUB_OUTPUT

            # Extraer stats si es JSON válido
            if echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); s=d.get('stats',{}); print(f\"Compras: {s.get('compras_synced',0)} (nuevas: {s.get('compras_new',0)}, actualizadas: {s.get('compras_updated',0)})\nItems: {s.get('items_synced',0)}\nPáginas: {s.get('pages_processed',0)}/{s.get('total_pages',0)}\nErrores: {s.get('errors_count',0)}\")" 2>/dev/null; then
              echo "Stats extraídas correctamente"
            fi
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "::error::Fetch falló con HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Resumen
        if: always()
        run: |
          echo "======================================"
          echo "FETCH COMPRAS ÁGILES - RESUMEN"
          echo "Fecha: $(TZ='America/Santiago' date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Estado: ${{ steps.fetch.outputs.status || 'unknown' }}"
          echo "======================================"
