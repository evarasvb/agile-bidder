name: Actualizar Riesgo de Instituciones

on:
  schedule:
    # Ejecutar cada lunes a las 2 AM (hora UTC)
    - cron: '0 2 * * 1'
  workflow_dispatch: # Permite ejecución manual

jobs:
  scrape-risk-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run risk scraping script
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx tsx src/scripts/poblar-riesgo-instituciones.ts
      
      - name: Notify on success
        if: success()
        run: echo "✅ Risk data updated successfully"
      
      - name: Notify on failure
        if: failure()
        run: echo "❌ Failed to update risk data"
